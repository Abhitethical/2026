
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body>

    <h2>Reset Password</h2>

    {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

    {% else %}

        <form method="POST">

            {% csrf_token %}

            <label>New Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                required
            >

            <br><br>

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

            <br><br>

            <button type="submit">
                Change Password
            </button>

        </form>

    {% endif %}

</body>
</html>
