
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h2>Forgot Password</h2>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    {% if success %}
        <p style="color:green;">
            {{ success }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter registered email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</body>
</html>
